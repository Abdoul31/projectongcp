##Installation de charte helm Declaratif GitOps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Abdoul31/projectongcp.git
    targetRevision: main
    path: envs/prod/msgitops/helm/microservices-demo/
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


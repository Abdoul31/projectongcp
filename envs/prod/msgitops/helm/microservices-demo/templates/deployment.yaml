{{ range $name, $svc := .Values.services }}
---
{{ if $svc.enabled }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}{{ if $svc.image.tag }}:{{ $svc.image.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  ###Accès global values postgre
      eenv:
      - name: DB_HOST
        value: {{ $.Values.postgres.host | default "postgres" | quote }}
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ $.Values.postgres.secretName }}
            key: POSTGRES_PASSWORD


---
{{ end }}
---
{{ end }}
